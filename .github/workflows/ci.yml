name: "CI/CD Pipeline"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  backend-test:
    name: Go Backend & Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25'
        check-latest: true

    - name: Setup Buf
      uses: bufbuild/buf-setup-action@v1.50.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Run Buf Lint
      run: buf lint

    - name: Run Native Go Vet & Fmt
      run: |
        test -z "$(gofmt -l .)" || { echo "Code not properly formatted. Run 'make format'"; exit 1; }
        go vet ./...
        
    - name: Validate Grafana Dashboard JSON
      run: jq empty monitoring/grafana_dashboard.json

    - name: Run Go Unit Tests
      run: go test -v -coverprofile=coverage.out ./...

    - name: Upload Go Coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.out
        flags: backend
        fail_ci_if_error: false

  frontend-test:
    name: React Frontend & Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Check ESLint
      working-directory: ./frontend
      run: npm run lint

    - name: Run Vitest Unit Tests
      working-directory: ./frontend
      run: npx vitest run --coverage

    - name: Upload Frontend Coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: frontend/coverage/lcov.info
        flags: frontend
        fail_ci_if_error: false

    - name: Test Build compilation
      working-directory: ./frontend
      run: npm run build

  e2e-test:
    name: Fullstack E2E Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25'

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Install Playwright Browsers
      working-directory: ./frontend
      run: npx playwright install --with-deps

    - name: Run E2E Tests
      working-directory: ./frontend
      run: npm run test:e2e

  deploy-staging:
    name: Deploy to Staging
    needs: [backend-test, frontend-test, e2e-test]
    runs-on: self-hosted
    if: github.repository == 'debalin/portify' && github.ref == 'refs/heads/master'
    steps:
      - name: Pull and Deploy
        run: |
          cd ~/portify
          git fetch origin master
          git checkout master
          git reset --hard origin/master
          docker compose --profile staging up --build -d

  sync-grafana-dashboard:
    name: Sync Grafana Dashboard
    needs: [backend-test, frontend-test, e2e-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v6

      - name: Push Dashboard to Grafana Cloud
        env:
          GRAFANA_URL: ${{ vars.GRAFANA_URL || 'https://debalin.grafana.net' }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_SERVICE_ACCOUNT_TOKEN }}
        run: |
          if [ -z "$GRAFANA_TOKEN" ]; then
            echo "::warning::GRAFANA_SERVICE_ACCOUNT_TOKEN secret is not configured in repository secrets. Skipping dashboard sync."
            exit 0
          fi
          echo "Syncing monitoring/grafana_dashboard.json to ${GRAFANA_URL}..."
          PAYLOAD=$(jq '{dashboard: ., overwrite: true, message: "Auto-updated from GitHub Actions"}' monitoring/grafana_dashboard.json)
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${GRAFANA_TOKEN}" \
            "${GRAFANA_URL}/api/dashboards/db" \
            -d "$PAYLOAD")
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")
          echo "Response: $BODY"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Failed to sync dashboard to Grafana. HTTP $HTTP_STATUS: $BODY"
            exit 1
          fi
          echo "Successfully synced dashboard to Grafana!"

